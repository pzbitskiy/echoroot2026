# /etc/echo-satellite.conf: every line is optional, the values shown are the
# defaults unless noted. Any of them can also be given as -o key=value.

## Identity
# Node name shown in Home Assistant; default is the host name.
#name = echo
#friendly_name = Echo
# Home Assistant identifies the device by this interface's MAC address.
#iface = wlan0
#mac =

## Network
#port = 6053
# Addresses allowed to connect, comma separated; empty allows everyone.
# The API has no authentication and a client can open the microphone, so
# set this to your Home Assistant host. (No default.)
#allow = 192.168.1.10
# Announce the device over mDNS for Home Assistant's discovery. (No default;
# without it, add the device in Home Assistant by address.)
#mdns_file = /etc/avahi/services/echo-satellite.service
# Accept any certificate when Home Assistant's URLs are https.
#tls_insecure = 0

## Audio
#mic_shm = /BMicsOut.shm
#pulse_sink = lab126-sink
#pulse_server =
# Format requested from Home Assistant for speech and media: WAV, mono,
# 16 bit, at this rate. 48000 is the speaker sink's own rate.
#tts_rate = 48000
# Gain applied to the microphone samples before they are sent, in dB. The
# DSP's output is quiet: in recordings made by Home Assistant, speech peaked
# at -28 to -40 dBFS without it. Samples that would overflow are limited.
#mic_gain_db = 20
# Passed to Home Assistant with every request (its audio enhancement).
#noise_suppression = 0
#auto_gain = 0
#volume_multiplier = 1.0

## Wake word: computer, alexa, echo or amazon. Home Assistant can change it;
## the choice is kept in state_file.
#wake_word = alexa
#locale = en-US
#state_file = /etc/echo-satellite.state
# The choice is stored for asrd with set-dynconf-value (asrd.model =
# <model_dir>/<locale>/<WORD>/pryon.manifest). asrd's WWModel property is
# tried first; if asrd still runs another model 6 s later, asr_restart_cmd is
# run and the init script starts asrd again. asr_runtime_switch = 0 skips the
# property and restarts asrd right away.
#model_dir = /usr/local/data/models/keyword/doppler
#asr_restart_cmd = killall asrd
#asr_runtime_switch = 1

## Timing
#start_timeout_ms = 5000
#listen_timeout_ms = 30000
#think_timeout_ms = 60000
# How long follow-up requests continue the same conversation.
#conversation_timeout_s = 300
# A finished timer rings this long unless silenced.
#ring_seconds = 300
#ring_gap_ms = 600

## LED ring: animation names from /usr/local/etc/ledd (without .animation).
## An empty value leaves the ring alone in that state.
#led_idle = off
#led_wake = active_start
#led_listening = alexa_user-talking
#led_thinking = alexa_thinking
#led_speaking = dialog-talk
#led_error = error
#led_timer = ready_timer
#led_muted = mics-off_on

## Sounds: local WAV files (PCM 16 bit). Empty: silent.
#sound_wake =
#sound_done =
#sound_error =
#sound_timer = /usr/local/share/earcon/doppler/base/system_alerts_melodic_01_short.wav
#sound_mute = /usr/local/share/earcon/doppler/base/controls_buttons_mic_off.wav
#sound_unmute = /usr/local/share/earcon/doppler/base/controls_buttons_mic_on.wav
# Stock sounds that fit sound_wake and sound_done:
#   /usr/local/share/earcon/doppler/base/system_state_active_start.wav
#   /usr/local/share/earcon/doppler/base/system_state_user_speech_confirmed.wav
