# Minimal SD card image for the Echo

image boot.vfat {
    vfat {
        files = {
            "MLO",
            "u-boot.bin",
        }
    }
    size = 16M
}

image sdcard.img {
    hdimage {
    }

    partition u-boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext2"
    }
}
